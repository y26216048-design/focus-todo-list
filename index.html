<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f5f6f8" />
  <meta name="description" content="Удобный список задач с сохранением в браузере." />
  <title>Focus — мои задачи</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <div class="eyebrow"><span class="mark" aria-hidden="true">✓</span> FOCUS / TASK MANAGER</div>
    <h1>Мои задачи<span style="color:#3a70ec">.</span></h1>
    <p class="intro">Меньше хаоса, больше сделанного.</p>
    <section class="panel" aria-label="Список задач">
      <form class="form" id="task-form"><label class="sr-only" for="task-input">Новая задача</label><input id="task-input" type="text" placeholder="Что нужно сделать?" maxlength="160" autocomplete="off" required /><button class="add" type="submit">+ Добавить</button></form>
      <div class="toolbar"><strong>Список задач</strong><span class="count" id="count">0 выполнено</span></div>
      <div class="progress" role="progressbar" aria-label="Прогресс выполнения" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress"><div id="progress-fill"></div></div>
      <div class="filters" role="group" aria-label="Фильтр задач"><button class="filter" type="button" data-filter="all" aria-pressed="true">Все</button><button class="filter" type="button" data-filter="active" aria-pressed="false">Активные</button><button class="filter" type="button" data-filter="done" aria-pressed="false">Выполненные</button></div>
      <ul class="tasks" id="tasks" aria-live="polite"></ul>
      <div class="bottom"><span id="remaining">Нет активных задач</span><button type="button" class="clear" id="clear" disabled>Очистить выполненные</button></div>
    </section>
    <p class="note">Ваши задачи автоматически сохраняются в этом браузере.</p>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
